<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark mode — night vellum</title>
<link rel="stylesheet" href="../colors_and_type.css">

</head>
<body class="card" data-theme="dark" style="background:#1A1816">
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#1A1816; border-color:#403C37;"></div>
      <span class="name" style="color:#F0EBE3">Warm</span>
      <span class="hex" style="color:#8A857D">#1A1816</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#201E1B; border-color:#403C37;"></div>

    <div class="swatch">
      <div class="chip" style="background:#242220; border-color:#403C37;"></div>

      <span class="hex" style="color:#8A857D">#242220</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#E8E3DC; border-color:#403C37;"></div>
      <span class="name" style="color:#F0EBE3">Ink</span>
      <span class="hex" style="color:#8A857D">#E8E3DC</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#C4533E; border-color:#403C37;"></div>
      <span class="name" style="color:#C4533E">Accent</span>
      <span class="hex" style="color:#8A857D">#C4533E</span>
    </div>
  </div>
  <div style="font-family:var(--sans-ui); font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:#5A5550;">夜晚的羊皮纸 · same vellum, dimmed</div>
