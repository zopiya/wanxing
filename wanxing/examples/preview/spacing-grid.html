<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · 4 px grid" subtitle="11 steps · 4 → 128, paragraph at 20, section at 96" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing — 4px grid</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .row-s { display: flex; align-items: center; gap: 14px; height: 16px; }
  .row-s .key { font-family: var(--mono); font-size: 11px; color: var(--fg-3); width: 48px; text-align:right; }
  .row-s .bar { background: var(--accent); height: 6px; }
  .row-s .use { font-family: var(--sans-ui); font-size: 11px; color: var(--fg-4); letter-spacing: 0.05em; }
</style>
</head>
<body class="card">
  <div class="col" style="gap:8px;">
    <div class="row-s"><span class="key">s-1</span><span class="bar" style="width:4px"></span><span class="use">4 · hairline gap</span></div>
    <div class="row-s"><span class="key">s-2</span><span class="bar" style="width:8px"></span><span class="use">8 · icon ↔ text</span></div>
    <div class="row-s"><span class="key">s-3</span><span class="bar" style="width:12px"></span><span class="use">12 · table cell · tag padding</span></div>
    <div class="row-s"><span class="key">s-4</span><span class="bar" style="width:16px"></span><span class="use">16 · code/quote inset · button</span></div>
    <div class="row-s"><span class="key">s-5</span><span class="bar" style="width:20px"></span><span class="use">20 · paragraph gap</span></div>
    <div class="row-s"><span class="key">s-6</span><span class="bar" style="width:24px"></span><span class="use">24 · list items · breadcrumb</span></div>
    <div class="row-s"><span class="key">s-8</span><span class="bar" style="width:32px"></span><span class="use">32 · heading → body</span></div>
    <div class="row-s"><span class="key">s-12</span><span class="bar" style="width:48px"></span><span class="use">48 · h3 → above</span></div>
    <div class="row-s"><span class="key">s-16</span><span class="bar" style="width:64px"></span><span class="use">64 · h2 → above</span></div>
    <div class="row-s"><span class="key">s-24</span><span class="bar" style="width:96px"></span><span class="use">96 · section gap (floor)</span></div>
    <div class="row-s"><span class="key">s-32</span><span class="bar" style="width:128px"></span><span class="use">128 · page top padding</span></div>
  </div>
</body>
</html>
