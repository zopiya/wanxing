<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Breathing ■" subtitle="The 8 px signature mark — Wenxin's only loop" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand mark — breathing ■</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
  <div class="row" style="align-items:baseline; gap:18px;">
    <svg width="44" height="44" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="align-self:center;">
      <rect width="64" height="64" rx="4" fill="#8B3525"/>
      <rect x="16" y="16" width="32" height="32" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M32 24v16M24 32h16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
    </svg>
    <div style="font-family:var(--serif-display); font-weight:700; color:var(--fg-1); font-size:36px; line-height:1; letter-spacing:0.05em;">万形</div>
    <span class="brand-mark" style="align-self:center;"></span>
    <div style="font-family:var(--serif-display); font-style:italic; color:var(--fg-3); font-size:18px; align-self:center; margin-left:8px;">Wanxing</div>
  </div>

  <div style="font-family:var(--serif-body); font-size:15px; line-height:1.7; color:var(--fg-3); max-width:580px;">
    The 8 × 8 px square is the only looping animation Wenxin allows: <code style="font-family:var(--mono); font-size:0.85em; background:var(--bg-4); padding:1px 5px; border-radius:2px;">opacity 1 → 0.6 → 1</code> on a 4 s ease-in-out cycle. It sits at the baseline of the brand name like a chop.
  </div>

  <div class="spread" style="border-top:1px solid var(--line-1); padding-top:10px;">
    <span class="label">Use after the brand name. Optional second appearance per page. Never in body copy.</span>
    <span class="hex">8 px desktop · 6 px mobile</span>
  </div>
</body>
</html>
