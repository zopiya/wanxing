<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Three principles" subtitle="文字即界面 · 留白即设计 · 克制即力量" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three principles</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 32px;">
    <div style="border-top:2px solid var(--line-1); padding-top:14px;">
      <div style="font-family:var(--sans-ui); font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--fg-4); margin-bottom:10px;">原则一</div>
      <div style="font-family:var(--serif-display); font-weight:700; color:var(--fg-1); font-size:18px;">文字即界面</div>
      <div style="font-family:var(--serif-display); font-style:italic; color:var(--fg-3); font-size:14px; margin-top:4px;">Text is the interface</div>
    </div>
    <div style="border-top:2px solid var(--line-1); padding-top:14px;">
      <div style="font-family:var(--sans-ui); font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--fg-4); margin-bottom:10px;">原则二</div>
      <div style="font-family:var(--serif-display); font-weight:700; color:var(--fg-1); font-size:18px;">留白即设计</div>
      <div style="font-family:var(--serif-display); font-style:italic; color:var(--fg-3); font-size:14px; margin-top:4px;">Whitespace is the design</div>
    </div>
    <div style="border-top:2px solid var(--line-1); padding-top:14px;">
      <div style="font-family:var(--sans-ui); font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--fg-4); margin-bottom:10px;">原则三</div>
      <div style="font-family:var(--serif-display); font-weight:700; color:var(--fg-1); font-size:18px;">克制即力量</div>
      <div style="font-family:var(--serif-display); font-style:italic; color:var(--fg-3); font-size:14px; margin-top:4px;">Restraint is the power</div>
    </div>
  </div>
</body>
</html>
