<!doctype html>
<!-- @dsCard group="Components" name="Components · Icon system" subtitle="Three sizes × three states — 1.5 px stroke at every scale" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icons — three sizes, three states</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .ic-row { display:grid; grid-template-columns: 80px 1fr 1fr 1fr; align-items:center; gap:18px; }
  .ic-row .lbl { font-family:var(--mono); font-size:11px; color:var(--fg-3); }
  .ic-cell { display:flex; align-items:center; gap:8px; color: var(--fg-3); font-family: var(--sans-ui); font-size:13px; }
  .ic-cell.hover { color: var(--fg-1); }
  .ic-cell.active { color: var(--accent); }
  .ic-state { font-family:var(--sans-ui); font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--fg-4); margin-top:14px; }
  svg.ic { display:inline-block; }
</style>
</head>
<body class="card">
  <div class="ic-state" style="margin-top:0;">DEFAULT · HOVER · ACTIVE / SELECTED</div>
  <div class="ic-row">
    <span class="lbl">icon-sm<br>16</span>
    <div class="ic-cell">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
      <span>Search</span>
    </div>
    <div class="ic-cell hover">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
      <span>Search</span>
    </div>
    <div class="ic-cell active">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.3-4.3"/></svg>
      <span>Search</span>
    </div>
  </div>
  <div class="ic-row">
    <span class="lbl">icon-md<br>20</span>
    <div class="ic-cell">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
      <span>Menu</span>
    </div>
    <div class="ic-cell hover">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
      <span>Menu</span>
    </div>
    <div class="ic-cell active">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
      <span>Menu</span>
    </div>
  </div>
  <div class="ic-row">
    <span class="lbl">icon-lg<br>24</span>
    <div class="ic-cell">
      <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4v7M4 11l8-7M13 20h7v-7M20 13l-8 7"/></svg>
      <span>Expand</span>
    </div>
    <div class="ic-cell hover">
      <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4v7M4 11l8-7M13 20h7v-7M20 13l-8 7"/></svg>
      <span>Expand</span>
    </div>
    <div class="ic-cell active">
      <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4v7M4 11l8-7M13 20h7v-7M20 13l-8 7"/></svg>
      <span>Expand</span>
    </div>
  </div>
  <div class="spread" style="border-top:1px solid var(--line-1); padding-top:10px;">
    <span class="label">Stroke 1.5 px at every size. Line-only, no fills. One library per product — never mix.</span>
  </div>
</body>
</html>
