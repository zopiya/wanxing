<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Borders" subtitle="1 px subtle and strong only — never thicker" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Borders</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#F2F0EB; border-color:#E5E1DA; border-width:1px;"></div>
      <span class="name">Subtle</span>
      <span class="hex">#E5E1DA · 1px</span>
      <span class="label">section hairline · tag</span>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#F2F0EB; border-color:#C8C3BA; border-width:1px;"></div>
      <span class="name">Strong</span>
      <span class="hex">#C8C3BA · 1px</span>
      <span class="label">button · 40px rule</span>
    </div>
    <div class="swatch" style="flex:1.6">
      <div class="chip" style="background:transparent; border:1px dashed #C8C3BA; display:flex; align-items:center; justify-content:center;">
        <span class="label" style="text-align:center; max-width:80%;">No border &gt; 1px. Ever.<br>Use whitespace, not strokes.</span>
      </div>
      <span class="name">Rule</span>
      <span class="label">borders are punctuation, not architecture</span>
    </div>
  </div>
</body>
</html>
