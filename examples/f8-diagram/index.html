      <path class="edge" d="M525 172 L525 232"/>

      <text class="nt" x="360" y="255" text-anchor="middle">第三层 · 组件类别覆盖</text>
      <text class="nt nt--sm" x="360" y="274" text-anchor="middle">数据录入与反馈 —— 永远按惯例，不论轨道</text>
