<style>
/* ============================================================
   文心设计 Token · F7 海报形态
   ============================================================ */

:root {
  /* —— 色彩 · 亮色模式 —— */
  --color-bg-warm:      #F2F0EB;
  --color-bg-base:      #FAFAF8;
  --color-bg-pure:      #FFFFFF;
  --color-bg-subtle:    #F0EDE7;

  --color-text-primary:   #3A3837;
  --color-text-secondary: #5A5550;
  --color-text-muted:     #888580;
  --color-text-heading:   #2C2B29;

  --color-accent:         #8B3525;
  --color-accent-hover:   #A84030;
  --color-accent-subtle:  #F5E8E5;

  --color-border-subtle:  #E5E1DA;
  --color-border-strong:  #C8C3BA;

  --color-focus: rgba(139, 53, 37, 0.4);

  /* —— 字体栈 —— */
  --font-display: "Lora", "Georgia", "Noto Serif SC", "Source Han Serif SC", serif;
  --font-body:    "EB Garamond", "Lora", "Georgia", "Noto Serif SC", "Source Han Serif SC", serif;
  --font-ui:      "SF Pro Text", system-ui, -apple-system, "Noto Sans SC", "PingFang SC", sans-serif;
  --font-mono:    "JetBrains Mono", "Fira Code", "SF Mono", monospace;

  /* —— 动效 Token —— */
  --duration-fast:    180ms;
  --duration-base:    260ms;
  --duration-slow:    420ms;
  --duration-crawl:   600ms;
  --duration-breath:  4000ms;
  --ease-default:     cubic-bezier(0.25, 0.1, 0.25, 1);
  --ease-out:         cubic-bezier(0, 0, 0.2, 1);
  --ease-in-out:      ease-in-out;

  /* —— 排版辅助 —— */
  --tracking-tight:    -0.02em;
  --tracking-normal:   0;
  --tracking-wide:     0.05em;
  --tracking-wider:    0.15em;
  --tracking-chinese:  0.1em;

  --leading-tight:    1.15;
  --leading-snug:     1.35;
  --leading-normal:   1.55;
  --leading-relaxed:  1.85;
  --leading-loose:    2.0;

  /* —— 间距 —— */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;
  --space-16: 64px;
}

/* —— 暗色模式 —— */
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg-warm:      #1A1816;
    --color-bg-base:      #201E1B;
    --color-bg-pure:      #242220;
    --color-bg-subtle:    #2A2724;

    --color-text-primary:   #E8E3DC;
    --color-text-secondary: #8A857D;
    --color-text-muted:     #9A948D;
    --color-text-heading:   #F0EBE3;

    --color-accent:         #C4533E;
    --color-accent-hover:   #D9614A;
    --color-accent-subtle:  #2E1A16;

    --color-border-subtle:  #2E2B27;
    --color-border-strong:  #403C37;

    --color-focus: rgba(196, 83, 62, 0.4);
  }
}

/* —— Reduced Motion —— */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================
   全局重置
   ============================================================ */

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  background: var(--color-bg-warm);
  color: var(--color-text-primary);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: clamp(8px, 2vw, 24px);
}

/* ============================================================
   海报容器
   ============================================================ */

.poster-stage {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-width: 900px;
}

.poster-canvas {
  /* 2:3 比例 · 响应式约束 · aspect-ratio 是主约束 */
  container-type: inline-size;
  container-name: poster;
  aspect-ratio: 2 / 3;

  /*
   * 宽度由双重约束计算：
   *   1. max-width:  min(760px, 92vw)   — 不超最大宽度
   *   2. calc(94dvh * 2/3)              — 高度不超 94dvh 时对应的最大宽度
   * 取两者中较小值，确保 2:3 比例始终成立。
   */
  --canvas-max-w: min(760px, 92vw);
  --canvas-height-w: calc(94dvh * 2 / 3);
  width: min(var(--canvas-max-w), var(--canvas-height-w));

  background: var(--color-bg-warm);
  position: relative;
  overflow: hidden;

  /* 进场动画初始状态 */
  opacity: 0;
  transform: translateY(8px);
}

/* 进场动画 */
.poster-canvas.entrance-animate {
  animation: posterEntrance var(--duration-slow) var(--ease-out) forwards;
}

@keyframes posterEntrance {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ============================================================
   海报内部布局 · 居中对称
   ============================================================ */

.poster-content {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12% 10%;
  gap: clamp(12px, 4cqi, 48px);
}

/* ============================================================
   海报元素
   ============================================================ */

/* ---- 主标题 · Accent #1 ---- */
.poster-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 11cqi, 8rem);
  font-weight: 700;
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-chinese);
  color: var(--color-accent);  /* ← Accent #1 */
  text-wrap: balance;
}

/* ---- 英文副标题 ---- */
.poster-subtitle-en {
  font-family: var(--font-display);
  font-size: clamp(1rem, 3.5cqi, 2rem);
  font-weight: 400;
  font-style: italic;
  line-height: var(--leading-snug);
  letter-spacing: var(--tracking-normal);
  color: var(--color-text-secondary);
  margin-top: clamp(4px, 1cqi, 8px);
}

/* ---- 水平分割线 ---- */
.poster-rule {
  width: clamp(120px, 28cqi, 280px);
  height: 1px;
  background: var(--color-border-strong);
  border: none;
  flex-shrink: 0;
}

/* ---- 正文区 ---- */
.poster-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(8px, 2cqi, 20px);
}

.poster-statement {
  font-family: var(--font-body);
  font-size: clamp(1rem, 2.4cqi, 1.5rem);
  font-weight: 400;
  line-height: var(--leading-relaxed);
  color: var(--color-text-primary);
  text-wrap: balance;
  max-width: 80%;
}

.poster-specs {
  font-family: var(--font-body);
  font-size: clamp(0.875rem, 1.9cqi, 1.125rem);
  font-weight: 400;
  line-height: var(--leading-normal);
  color: var(--color-text-secondary);
  letter-spacing: var(--tracking-wide);
}

/* ---- 署名区 ---- */
.poster-attribution {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(4px, 0.8cqi, 8px);
}

.poster-signature {
  font-family: var(--font-display);
  font-size: clamp(1.125rem, 2.8cqi, 2rem);
  font-weight: 600;
  line-height: var(--leading-snug);
  color: var(--color-text-heading);
  display: flex;
  align-items: baseline;
  gap: clamp(4px, 0.6cqi, 8px);
}

/* 品牌标识符 ■ · Accent #2 */
.brand-mark {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--color-accent);  /* ← Accent #2 */
  flex-shrink: 0;
  align-self: center;
  margin-bottom: 0.08em;
}

/* ■ 呼吸动效 */
.brand-mark.breathing {
  animation: brandBreath var(--duration-breath) var(--ease-in-out) infinite;
}

@keyframes brandBreath {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.55; }
}

/* ============================================================
   响应式微调
   ============================================================ */

@media (max-width: 640px) {
  .brand-mark {
    width: 6px;
    height: 6px;
  }
}

@media (max-width: 480px) {
  .poster-content {
    padding: 10% 8%;
  }
  .poster-statement {
    max-width: 90%;
  }
}

/* ============================================================
   可访问性
   ============================================================ */

/* 焦点环 */
.poster-canvas:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* 选中色 */
::selection {
  background: var(--color-accent-subtle);
  color: var(--color-text-primary);
}
</style>

<!-- 动画完成信号脚本 -->
<script>
(function () {
  var html = document.documentElement;
  var MAX_WAIT = 5000;
  var timedOut = false;

  var safetyTimer = setTimeout(function () {
    timedOut = true;
    html.dataset.animationsComplete = "true";
  }, MAX_WAIT);

  function markComplete() {
    if (timedOut) return;
    clearTimeout(safetyTimer);
    html.dataset.animationsComplete = "true";
  }

  function waitForAnimations() {
    var animations = document.getAnimations();
    if (!animations || animations.length === 0) {
      markComplete();
      return;
    }
    Promise.allSettled(
      Array.from(animations).map(function (a) {
        return a.finished;
      })
    ).then(function () {
      markComplete();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", waitForAnimations);
  } else {
    waitForAnimations();
  }
})();
</script>
