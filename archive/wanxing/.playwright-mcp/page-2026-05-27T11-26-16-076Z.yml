                - generic [ref=f11e41]:
                  - paragraph [ref=f11e42]:
                    - text: 万形是一个专注于文心（Wenxin）设计语言的 OpenCode 设计工程。
                    - text: 进入 wanxing 目录，描述需求，即可产出遵循东方极简美学的 UI。
                  - paragraph [ref=f11e43]:
                    - text: 它由两层 Agent 架构驱动——编排层理解意图、澄清约束，
                    - text: 执行层将设计语言准确落地。设计即代码，代码即设计。
