              - region "近期文章" [ref=f6e22]:
                - heading "近期文章" [level=2] [ref=f6e23]
                - paragraph [ref=f6e24]: 探索设计、文字与克制之美。
                - generic [ref=f6e25]:
                  - article [ref=f6e26]:
                    - generic [ref=f6e27]:
                      - time [ref=f6e28]: 2026 年 5 月 20 日
                      - generic [ref=f6e29]: 设计语言
                    - heading "文心规范 1.0：从哲学到 Token 的完整设计体系" [level=3] [ref=f6e30]:
                      - link "文心规范 1.0：从哲学到 Token 的完整设计体系" [ref=f6e31] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f6e32]: 文心设计语言由两个层次构成：第一层是灵魂——色彩系统、字体哲学、留白密度、点睛之色、动效节奏，永远不变；第二层是形态——布局结构、导航形式、内容组织方式，随境而化。水的本质不因容器而改变，但在杯子里是杯子的形，在河道里是河道的形。
                    - link "继续阅读 →" [ref=f6e33] [cursor=pointer]:
                      - /url: "#"
                  - article [ref=f6e34]:
                    - generic [ref=f6e35]:
                      - time [ref=f6e36]: 2026 年 5 月 15 日
                      - generic [ref=f6e37]: 排版
                    - heading "留白的力量：为什么间距比装饰更重要" [level=3] [ref=f6e38]:
                      - link "留白的力量：为什么间距比装饰更重要" [ref=f6e39] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f6e40]: 留白不是空缺，是设计的一部分。足够的留白让内容呼吸、让层次清晰、让眼睛休息。在移动端，留白尤其重要——小屏幕上拥挤的内容会导致认知过载。当觉得「间距是不是太大了」时，往往才是刚好。
                    - link "继续阅读 →" [ref=f6e41] [cursor=pointer]:
                      - /url: "#"
                  - article [ref=f6e42]:
                    - generic [ref=f6e43]:
                      - time [ref=f6e44]: 2026 年 5 月 10 日
                      - generic [ref=f6e45]: 动效
                    - heading "春雨润物：文心动效的克制哲学" [level=3] [ref=f6e46]:
                      - link "春雨润物：文心动效的克制哲学" [ref=f6e47] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f6e48]: 动效的存在如同书页翻动时纸张的阻力：你感到用心，但不会停下来欣赏它。用户感受到「顺」，而非「炫」。品牌标识符 ■ 的呼吸动效是全页唯一的循环——出现越少，力量越大。
                    - link "继续阅读 →" [ref=f6e49] [cursor=pointer]:
                      - /url: "#"
              - blockquote [ref=f6e51]:
                - paragraph [ref=f6e52]: 「设计的力量来自克制而非张扬。通过精心控制的留白、温暖的色调和微妙的排版细节，创造一种安静而有力的视觉体验。」
