                - heading "近期文章" [level=2] [ref=f2e23]
                - paragraph [ref=f2e24]: 探索设计、文字与克制之美。
                - generic [ref=f2e25]:
                  - article [ref=f2e26]:
                    - generic [ref=f2e27]:
                      - time [ref=f2e28]: 2026 年 5 月 20 日
                      - generic [ref=f2e29]: 设计语言
                    - heading "文心规范 1.0：从哲学到 Token 的完整设计体系" [level=3] [ref=f2e30]:
                      - link "文心规范 1.0：从哲学到 Token 的完整设计体系" [ref=f2e31] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f2e32]: 文心设计语言由两个层次构成：第一层是灵魂——色彩系统、字体哲学、留白密度、点睛之色、动效节奏，永远不变；第二层是形态——布局结构、导航形式、内容组织方式，随境而化。水的本质不因容器而改变，但在杯子里是杯子的形，在河道里是河道的形。
                    - link "继续阅读 →" [ref=f2e33] [cursor=pointer]:
                      - /url: "#"
                  - article [ref=f2e34]:
                    - generic [ref=f2e35]:
                      - time [ref=f2e36]: 2026 年 5 月 15 日
                      - generic [ref=f2e37]: 排版
                    - heading "留白的力量：为什么间距比装饰更重要" [level=3] [ref=f2e38]:
                      - link "留白的力量：为什么间距比装饰更重要" [ref=f2e39] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f2e40]: 留白不是空缺，是设计的一部分。足够的留白让内容呼吸、让层次清晰、让眼睛休息。在移动端，留白尤其重要——小屏幕上拥挤的内容会导致认知过载。当觉得「间距是不是太大了」时，往往才是刚好。
                    - link "继续阅读 →" [ref=f2e41] [cursor=pointer]:
                      - /url: "#"
                  - article [ref=f2e42]:
                    - generic [ref=f2e43]:
                      - time [ref=f2e44]: 2026 年 5 月 10 日
                      - generic [ref=f2e45]: 动效
                    - heading "春雨润物：文心动效的克制哲学" [level=3] [ref=f2e46]:
                      - link "春雨润物：文心动效的克制哲学" [ref=f2e47] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f2e48]: 动效的存在如同书页翻动时纸张的阻力：你感到用心，但不会停下来欣赏它。用户感受到「顺」，而非「炫」。品牌标识符 ■ 的呼吸动效是全页唯一的循环——出现越少，力量越大。
                    - link "继续阅读 →" [ref=f2e49] [cursor=pointer]:
                      - /url: "#"
