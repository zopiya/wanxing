                      - link "春雨润物：文心动效的克制哲学" [ref=f1e47] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f1e48]: 动效的存在如同书页翻动时纸张的阻力：你感到用心，但不会停下来欣赏它。用户感受到「顺」，而非「炫」。品牌标识符 ■ 的呼吸动效是全页唯一的循环——出现越少，力量越大。
                    - link "继续阅读 →" [ref=f1e49] [cursor=pointer]:
                      - /url: "#"
