                    - heading "留白的力量：为什么间距比装饰更重要" [level=3] [ref=f1e38]:
                      - link "留白的力量：为什么间距比装饰更重要" [ref=f1e39] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f1e40]: 留白不是空缺，是设计的一部分。足够的留白让内容呼吸、让层次清晰、让眼睛休息。在移动端，留白尤其重要——小屏幕上拥挤的内容会导致认知过载。当觉得「间距是不是太大了」时，往往才是刚好。
                    - link "继续阅读 →" [ref=f1e41] [cursor=pointer]:
                      - /url: "#"
