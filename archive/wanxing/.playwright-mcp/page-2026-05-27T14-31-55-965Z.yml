                - paragraph [ref=f1e24]: 探索设计、文字与克制之美。
                - generic [ref=f1e25]:
                  - article [ref=f1e26]:
                    - generic [ref=f1e27]:
                      - time [ref=f1e28]: 2026 年 5 月 20 日
                      - generic [ref=f1e29]: 设计语言
                    - heading "文心规范 1.0：从哲学到 Token 的完整设计体系" [level=3] [ref=f1e30]:
                      - link "文心规范 1.0：从哲学到 Token 的完整设计体系" [ref=f1e31] [cursor=pointer]:
                        - /url: "#"
                    - paragraph [ref=f1e32]: 文心设计语言由两个层次构成：第一层是灵魂——色彩系统、字体哲学、留白密度、点睛之色、动效节奏，永远不变；第二层是形态——布局结构、导航形式、内容组织方式，随境而化。水的本质不因容器而改变，但在杯子里是杯子的形，在河道里是河道的形。
                    - link "继续阅读 →" [ref=f1e33] [cursor=pointer]:
                      - /url: "#"
                  - article [ref=f1e34]:
