<!doctype html>
<!-- @dsCard group="Components" name="Components · Form input" subtitle="Default / focus / error / disabled — errors use accent, not red" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form input</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-family:var(--sans-ui); font-size:13px; color:var(--fg-3); letter-spacing:0.04em; }
  .field input {
    font-family: var(--serif-body); font-size: 16px;
    color: var(--fg-2); background: var(--bg-3);
    border: 1px solid var(--line-1);
    padding: 12px 16px; border-radius: 4px;
    outline: none;
  }
  .field .hint { font-family:var(--sans-ui); font-size:11px; color:var(--fg-4); letter-spacing:0.04em; }
  .err input { border-color: var(--accent); }
  .err .hint { color: var(--accent); }
  .row-f { display:grid; grid-template-columns: 1fr 1fr; gap: 24px; }
</style>
</head>
<body class="card">
  <div class="row-f">
    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="you@example.com">
      <span class="hint">Default · placeholder uses --fg-4</span>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" value="reader@wanxing.dev" style="outline:2px solid var(--focus-ring); outline-offset:2px;">
      <span class="hint">Focus · 2px ring, brick at 40% α</span>
    </div>
    <div class="field err">
      <label>Email</label>
      <input type="email" value="not an email">
      <span class="hint">Invalid email · errors flag in accent, never red</span>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" value="reader@wanxing.dev" disabled style="color:var(--fg-4); background:var(--bg-4);">
      <span class="hint">Disabled · muted ink on tinted background</span>
    </div>
  </div>
</body>
</html>
