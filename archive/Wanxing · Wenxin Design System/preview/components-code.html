<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Code — inline & block</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
  <p style="font-family:var(--serif-body); font-size:17px; line-height:1.85; color:var(--fg-2); margin:0;">
    The token <code style="font-family:var(--mono); font-size:0.9em; background:var(--bg-4); padding:2px 6px; border-radius:3px;">--accent</code> resolves to <code style="font-family:var(--mono); font-size:0.9em; background:var(--bg-4); padding:2px 6px; border-radius:3px; color:var(--accent);">#8B3525</code> in light mode and to <code style="font-family:var(--mono); font-size:0.9em; background:var(--bg-4); padding:2px 6px; border-radius:3px;">#C4533E</code> at night.
  </p>
  <pre style="font-family:var(--mono); font-size:13px; line-height:1.6; color:var(--fg-2); background:var(--bg-4); border-left:3px solid var(--line-2); padding:14px 16px; border-radius:4px; margin:0;"><span style="color:#888580;">/* The one-and-only accent declaration */</span>
:root {
  --accent: <span style="color:#8B3525;">#8B3525</span>;
  --leading-relaxed: <span style="color:#7A5C3A;">1.85</span>;
}</pre>
</body>
</html>
