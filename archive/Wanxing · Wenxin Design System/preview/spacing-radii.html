<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Radii (≤ 4 px)" subtitle="0 · 2 · 4 — anything more is forbidden" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii — ≤ 4px</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="card">
  <div class="row" style="align-items:flex-end;">
    <div class="col" style="align-items:center; gap:8px;">
      <div style="width:88px; height:88px; background:var(--bg-4); border:1px solid var(--line-1); border-radius:0;"></div>
      <span class="name">r-none</span>
      <span class="hex">0</span>
    </div>
    <div class="col" style="align-items:center; gap:8px;">
      <div style="width:88px; height:88px; background:var(--bg-4); border:1px solid var(--line-1); border-radius:2px;"></div>
      <span class="name">r-sm</span>
      <span class="hex">2 · tags · code</span>
    </div>
    <div class="col" style="align-items:center; gap:8px;">
      <div style="width:88px; height:88px; background:var(--bg-4); border:1px solid var(--line-1); border-radius:4px;"></div>
      <span class="name">r-md</span>
      <span class="hex">4 · buttons · pre · seal</span>
    </div>
    <div class="col" style="align-items:center; gap:8px;">
      <div style="width:88px; height:88px; background:#F5E8E5; border:1px dashed var(--line-2); border-radius:9999px; display:flex; align-items:center; justify-content:center;">
        <span class="label" style="text-align:center; color:var(--accent);">no pills<br>except ■</span>
      </div>
      <span class="name" style="color:var(--accent)">forbidden</span>
      <span class="hex">&gt; 4px</span>
    </div>
  </div>
</body>
</html>
