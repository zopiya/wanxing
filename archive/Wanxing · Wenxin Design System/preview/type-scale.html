<!doctype html>
<!-- @dsCard group="Type" name="Type · Major-Third scale" subtitle="11 → 72 px, eight steps" viewport="700x330" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type scale — Major Third</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .ladder { display:grid; grid-template-columns: 60px 60px 1fr; row-gap:10px; column-gap:14px; align-items:baseline; }
  .ladder .tok { font-family: var(--sans-ui); font-size: 11px; color: var(--fg-4); letter-spacing: 0.12em; text-transform: uppercase; }
  .ladder .px { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }
  .ladder .sp { font-family: var(--serif-display); color: var(--fg-1); line-height: 1.1; }
</style>
</head>
<body class="card">
  <div class="ladder">
    <span class="tok">5xl</span><span class="px">72</span><span class="sp" style="font-size:56px;">Aa 万</span>
    <span class="tok">4xl</span><span class="px">48</span><span class="sp" style="font-size:38px;">Aa 万</span>
    <span class="tok">3xl</span><span class="px">36</span><span class="sp" style="font-size:30px;">Aa 万形</span>
    <span class="tok">2xl</span><span class="px">30</span><span class="sp" style="font-size:24px;">Aa 万形</span>
    <span class="tok">xl</span><span class="px">24</span><span class="sp" style="font-size:20px;">Aa 万形 Wanxing</span>
    <span class="tok">lg</span><span class="px">20</span><span class="sp" style="font-size:17px; font-family:var(--serif-body);">Aa 万形 Wanxing</span>
    <span class="tok">md</span><span class="px">17</span><span class="sp" style="font-size:14px; font-family:var(--serif-body);">Aa 万形 — body reading</span>
    <span class="tok">sm</span><span class="px">13</span><span class="sp" style="font-size:12px; font-family:var(--sans-ui); letter-spacing:0.12em; text-transform:uppercase; color:var(--fg-3);">METADATA · LABEL</span>
  </div>
</body>
</html>
