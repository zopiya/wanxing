<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="../kit/index.css">
<link rel="stylesheet" href="./assets/site.css?v=6">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
</head>
<body class="wx-page">
<a class="wx-skip" href="#main">跳到主要内容</a>

<header class="doc-topbar">
  <a class="doc-brand" href="./index.html">
    <span class="wx-seal" aria-hidden="true"></span>
    <span>文心 · 万形</span>
  </a>
  <nav class="doc-primary" aria-label="主要导航">
{{topnav}}
  </nav>
  <button class="doc-navtoggle wx-btn wx-btn--text" type="button"
          data-wx-toggle="#doc-sidebar" aria-expanded="false" aria-controls="doc-sidebar">目录</button>
  <div class="doc-topbar__end">
    <button class="wx-switch" type="button" role="switch" aria-checked="false" aria-label="切换暗色模式"></button>
  </div>
</header>

<div class="doc-shell {{shellClass}}">
  <nav class="doc-sidebar" id="doc-sidebar" aria-label="站点导航">
{{nav}}
  </nav>

  <main class="doc-main" id="main">
    <article class="doc-article">
{{body}}
    </article>
  </main>

  <div class="doc-aside">{{toc}}</div>
</div>

<footer class="doc-footer">
  <p>文字即界面，留白即设计，克制即力量。</p>
  <p>Text is the interface. Whitespace is the design. Restraint is the power.</p>
</footer>

<script src="../kit/components/js/disclosure.js"></script>
<script src="../kit/components/js/overlay.js"></script>
<script src="../kit/components/js/tabs.js"></script>
<script src="./assets/site.js"></script>
</body>
</html>
